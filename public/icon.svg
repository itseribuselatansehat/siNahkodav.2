<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Ship Helm / Steering Wheel Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="16" opacity="0.9"/>
  <circle cx="256" cy="256" r="88" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.9"/>
  
  <!-- Helm Spokes (8 spokes) -->
  <g stroke="#ffffff" stroke-width="14" stroke-linecap="round">
    <line x1="256" y1="56" x2="256" y2="456"/>
    <line x1="56" y1="256" x2="456" y2="256"/>
    <line x1="114" y1="114" x2="398" y2="398"/>
    <line x1="114" y1="398" x2="398" y2="114"/>
  </g>
  
  <!-- Center Emblem (Medical Cross + Heart) -->
  <circle cx="256" cy="256" r="70" fill="#ffffff" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.25))"/>
  
  <!-- Medical Red Cross -->
  <path d="M236 206 h40 v30 h30 v40 h-30 v30 h-40 v-30 h-30 v-40 h30 z" fill="#ef4444"/>
  
  <!-- Compass Star Accents -->
  <polygon points="256,120 262,138 280,138 266,148 271,166 256,154 241,166 246,148 232,138 250,138" fill="url(#goldGrad)"/>
</svg>
