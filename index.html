    <script>
      (function() {
        // Safe mock WebSocket for Vite HMR in cloud sandbox environment where HMR WebSocket is disabled
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OriginalWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || protocols === 'vite-ping') {
              var listeners = {};
              var fakeWs = {
                url: url,
                readyState: 1, // WebSocket.OPEN
                OPEN: 1,
                CLOSED: 3,
                CONNECTING: 0,
                CLOSING: 2,
                send: function() {},
                close: function() {
                  fakeWs.readyState = 3;
                },
                addEventListener: function(evt, fn) {
                  if (!listeners[evt]) listeners[evt] = [];
                  listeners[evt].push(fn);
                  if (evt === 'open') {
                    setTimeout(function() {
                      fakeWs.readyState = 1;
                      try { fn({ type: 'open' }); } catch(err) {}
                    }, 0);
                  }
                },
                removeEventListener: function(evt, fn) {
                  if (listeners[evt]) {
                    listeners[evt] = listeners[evt].filter(function(f) { return f !== fn; });
                  }
                },
                dispatchEvent: function() { return true; }
              };
              return fakeWs;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
          window.WebSocket.OPEN = OriginalWebSocket.OPEN;
          window.WebSocket.CLOSING = OriginalWebSocket.CLOSING;
          window.WebSocket.CLOSED = OriginalWebSocket.CLOSED;
        }

        // Suppress benign Vite HMR websocket disconnect warnings in cloud proxy environment
        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var str = (arg && (arg.message || arg.stack || (typeof arg === 'string' ? arg : ''))) || '';
            if (str.indexOf('WebSocket') !== -1 || str.indexOf('[vite]') !== -1) {
              return;
            }
          }
          return origConsoleError.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('[vite]') !== -1) {
            e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason && (e.reason.message || String(e.reason))) || '';
          if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('[vite]') !== -1) {
            e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
          }
        }, true);
      })();
    </script>
